# FULL FLOOR TOOLCHAIN, and the single source of truth for tool VERSIONS.
# Every tool the floor uses is pinned here. Which of them a given job actually
# installs is decided per job, not by this file.
#
# THE CREDENTIALED JOBS INSTALL A SUBSET, and it is worth being precise about
# what makes that true, because the earlier version of this comment got it
# wrong in a way that was about to expire.
#
# It used to say the credentialed trunk workflow reads the ANCHOR's two-tool
# mise.toml rather than this one, so the job holding the review engine's token
# and the App key installs two tools. The mechanism was real: the trunk
# workflow is `workflow_run`-triggered, so GitHub resolves it, and everything
# it checks out, from the DEFAULT branch. But it was true only for as long as
# the anchor stays the default branch. At cutover `main` inherits THIS file,
# and the claim silently inverts: those jobs would begin installing everything
# below. Worse, a repository harnx GENERATES has no anchor at all and is born
# in exactly that post-cutover shape, so the protection never applied to the
# repos this floor exists to produce. (The old comment also said "twelve"; the
# count was eleven, which is the other reason a hand-maintained number in
# prose is a liability.)
#
# What makes it true now does not depend on which branch is default: each job
# in .github/workflows/ai-review-trunk.yml passes `install_args` to
# jdx/mise-action, naming the tools it actually runs. `review` takes jq and the
# claude CLI; `context`, `post_findings` and `resolved` take jq alone. Versions
# still come from here, so there is one place to bump a pin and no second
# config to drift out of sync.
#
# That scoping is a security control rather than a speed one: every installed
# tool's bin directory joins PATH, so a compromised pinned artifact could
# shadow a binary those scripts do execute, `jq` most of all. It is enforced by
# scripts/tests/trunk-toolchain.bash, which fails if a job invokes a binary it
# does not install, or installs one this file does not pin.

[settings]
# mise hooks are an explicitly experimental feature, mise's own label rather
# than a stability guarantee, and mise refuses to run one unless the config opts
# in here. The opt-in is scoped to this repository's config, not the developer's
# global one.
#
# This flag is broader than the one feature that needs it: mise exposes a single
# `experimental` switch and no per-feature equivalent (confirmed against
# `mise settings --all` on the pinned 2025.10.10), so enabling hooks means
# enabling every experimental behaviour. That is accepted rather than
# overlooked.
#
# What genuinely bounds it: nothing else in this file opts into an experimental
# feature, so the flag currently unlocks exactly one behaviour that is used.
#
# What does NOT bound it: version pinning. Every workflow pins jdx/mise-action,
# so CI's set of experimental behaviours cannot shift underneath the repository.
# A developer machine has no such pin.
experimental = true

[hooks]
# ONE postinstall, running BOTH setup scripts, because TOML permits one key of
# that name and two rungs each need a hook here. `mise install` is the first
# command anybody runs in a fresh clone or worktree, so both rides it rather
# than living in a README instruction nobody reads:
#
#   setup-hooks.sh       installs the git hook types this floor declares
#                        (pre-commit, commit-msg, post-checkout, pre-push,
#                        pre-merge-commit). Carried up from the trust anchor:
#                        this file replaces the anchor's copy wholesale at the
#                        same path, so dropping it would disarm hook
#                        installation for every rung above and for every
#                        repository harnx generates, silently.
#   setup-git-config.sh  writes the three settings the stacking protocol depends
#                        on (pull.rebase, push.default, alias.stack), which
#                        cannot then be forgotten, and which re-running install
#                        cannot drift because the script only ever overwrites.
#
# THE PATHS ARE ABSOLUTE, via {{config_root}}, and that is not cosmetic. A bare
# `scripts/...` resolves against mise's CWD, and mise runs a hook from wherever
# mise was invoked, which is not guaranteed to be this repository. The anchor's
# copy of this block used the relative form; it worked because the hook happens
# to run from the repository root in the cases exercised so far, not because the
# form is correct.
#
# The interpolation is quoted: {{config_root}} expands to a real filesystem
# path, and a clone under a directory with a space in it would otherwise
# word-split into two arguments and fail with a confusing "No such file".
#
# Caveat worth knowing rather than rediscovering: mise will not run hooks from
# an untrusted config, so a freshly created worktree needs `mise trust` once
# before `mise install` will fire these.
#
# CI needs no such step, and it is worth saying so rather than leaving the
# question open: jdx/mise-action sets MISE_TRUSTED_CONFIG_PATHS to the workspace
# before installing, so the checkout is already trusted and the hooks run.
# Confirmed in a real run, which logs both the trust assignment and the script's
# own line:
#   Setting MISE_TRUSTED_CONFIG_PATHS=/home/runner/work/harnx/harnx
#   setup-git-config: configured pull.rebase, push.default and alias.stack ...
postinstall = 'bash "{{config_root}}/scripts/mise/setup-hooks.sh" && bash "{{config_root}}/scripts/mise/setup-git-config.sh"'

[tools]
pre-commit = "3.7.1"
yamllint = "1.35.1"
actionlint = "1.7.1"
shellcheck = "0.10.0"
shfmt = "3.8.0"
taplo = "0.9.3"
"npm:markdownlint-cli" = "0.41.0"
gitleaks = "8.21.2"
vale = "3.17.1"
jq = "1.7.1"
lychee = "0.23.0"
# npm_args counters mise's npm backend default of --ignore-scripts=true: this
# package ships its actual binary via a postinstall script that fetches a
# platform-native optional dependency, so skipping scripts leaves `claude`
# installed but non-functional ("claude native binary not installed").
# Verified locally with a forced fresh reinstall (mise install --force) that
# this config actually produces a working binary. This alone was NOT enough
# on CI, though: mise itself is not pinned anywhere else in this repo, so
# jdx/mise-action silently installed whatever mise release was latest at
# runtime, a materially newer version than the one this config was verified
# against, whose npm backend did not honor npm_args the same way and hit the
# exact same "native binary not installed" failure regardless of this
# setting. The `version: "2025.10.10"` pin on every jdx/mise-action step in
# .github/workflows/*.yml (matching the mise release this was verified
# against) is required alongside this npm_args setting, not optional; either
# one alone reproduced the CI failure.
"npm:@anthropic-ai/claude-code" = { version = "2.1.245", npm_args = "--ignore-scripts=false" }

# Task runner: mise is the single entry point for commands as well as tools, so
# every floor command runs through the pinned toolchain above, never the
# developer machine's tools. `mise tasks` lists them; `mise run <name>` runs one.
#
# THERE IS ONE LIST OF GATES AND IT IS NOT HERE. `lint` goes through pre-commit
# rather than invoking the linters itself, so .pre-commit-config.yaml says WHAT
# the floor checks and this file says WHICH VERSION runs, one axis each.
#
# It used to be the other way: five `lint:<type>` tasks each ran a tool over
# `git ls-files`, while .pre-commit-config.yaml declared the same tools again as
# hooks. Two lists, and nothing made them agree. A gate added to one was absent
# from the other, and the hook and CI could enforce different rules while both
# reporting Passed. Losing per-tool runs costs nothing: `pre-commit run <id>
# --all-files` is the same thing, from the list that is now the only one.
#
# Any convenience wrapper added here must delegate to pre-commit rather than
# name a tool, or the second list is reborn.

[tasks.lint]
description = "run every floor gate over the whole tree (the same set CI runs)"
run = "pre-commit run --all-files --show-diff-on-failure"

[tasks.test]
description = "run the shell-test suite (scripts/tests/*.bash)"
run = "bash scripts/mise/test.sh"

[tasks."ai-review:local"]
description = "run the thin local ai-review against the working tree (no CI, no posting)"
run = "bash scripts/mise/ai-review-local.sh"
