# Vale prose-style config: the harness floor. This first rule (styles/House/)
# is the only one genesis ships; more join as later increments add more
# Markdown surface.
#
#   - NoEmDash (error, blocking): no em-dashes; use punctuation or a
#     connective word instead.
#   - ProseWalls (error, blocking): no paragraph or list item over 60 words.
StylesPath = styles
MinAlertLevel = error

[*.md]
BasedOnStyles = House
