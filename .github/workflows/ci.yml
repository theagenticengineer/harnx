name: ci
# EVERY JOB INSTALLS ONLY THE TOOLS IT RUNS, through mise-action's
# `install_args`. Without it each job installs the whole toolchain, which is
# eleven tools for a job that runs one.
#
# The reason is not speed. Every installed tool's bin directory joins PATH, so a
# compromised pinned artifact could shadow a binary the job does execute. A job
# that installs a tool it never invokes is carrying that risk for nothing, and
# `scripts/tests/ci-toolchain.bash` fails a job that invokes a binary it does
# not install, or installs one mise.toml does not pin.
#
# Versions still come from mise.toml. `install_args` names WHICH tools, never
# which versions, so there is one place to bump a pin and no second list to
# drift.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0 }
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          version: "2025.10.10"
          # Every tool a hook in .pre-commit-config.yaml invokes, plus
          # pre-commit itself. This job is the one that legitimately needs
          # nearly the whole toolchain, because it runs every gate.
          install_args: >-
            pre-commit shellcheck shfmt yamllint actionlint
            npm:markdownlint-cli taplo vale gitleaks lychee
      # `mise run lint`, not the pre-commit invocation spelled out again. It is
      # the same string a developer runs locally, so the two cannot come to mean
      # different things.
      - run: mise run lint
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          version: "2025.10.10"
          install_args: actionlint
      - run: actionlint
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0 }
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          version: "2025.10.10"
          install_args: gitleaks
      # `git`, not `dir`: `dir` only scans the files on disk at HEAD, so a
      # secret added and then removed within the same PR's commit history
      # would silently pass, even with fetch-depth: 0 (that flag fetches the
      # history, but `dir` never looks at it). `git` scans the commits
      # themselves, which is what fetch-depth: 0 was fetched for in the
      # first place.
      # `--config`, explicitly. Without it gitleaks searches upward from the
      # working directory, which is not the same search from a job's checkout
      # as from a developer's shell, and the allowlist that keeps this floor's
      # own documented example credentials from tripping the scanner would
      # apply to the hook and not to this required check.
      - run: gitleaks git . --redact --no-banner --config .gitleaks.toml
  shell-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          version: "2025.10.10"
          # jq, which sixteen of the suites parse fixtures with; shfmt, for
          # the suites that shell out to `mise exec -- shfmt`; and gitleaks,
          # which scripts/tests/secret-scan-arms.bash needs because it runs the
          # secret-scanning hook's real entry against a planted secret.
          #
          # Kept honest by scripts/tests/ci-toolchain.bash, which derives this
          # list from what the suites actually invoke rather than trusting it.
          install_args: jq shfmt gitleaks shellcheck
      - run: mise run test
