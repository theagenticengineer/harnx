name: ci
# PART REAL, PART PLACEHOLDER. Read which is which before trusting a green
# check from this file.
#
# This branch is the epic's TRUST ANCHOR: it is the repository's default
# branch, and it carries the ai-review security core, not the hygiene floor.
#
# `shell-tests` IS REAL HERE. It runs `mise run test`, which globs
# scripts/tests/*.bash over the anchor's own scripts. It used to echo a
# warning and pass, which is why every defect in those scripts had to be
# found by a reviewer rather than by a test: the branch every `workflow_run`
# in the stack resolves from declared eight required checks and verified none
# of them.
#
# `pre-commit`, `actionlint` and `gitleaks` are STILL PLACEHOLDERS. They read
# config the floor owns (.pre-commit-config.yaml, .yamllint.yaml, .vale.ini,
# styles/), which lives on the CHILD BRANCH IMMEDIATELY ABOVE this one, so
# they could not run here even if this file tried.
#
# Why the placeholders exist at all: branch protection requires the four
# contexts below. For a `pull_request` event GitHub reads workflow files from
# the pull request's HEAD branch, so a pull request whose head is THIS branch
# would never report them and would sit permanently blocked on checks that
# can never arrive. This file makes them report.
#
# WHAT THAT COSTS, stated plainly: for a pull request cut directly from this
# branch, those three checks are green and mean NOTHING. That is the same
# shape as the tamper this repo's CODEOWNERS exists to catch ("redefining
# mise.toml's test task to a no-op"), shipped deliberately, with its eyes
# open, scoped to the one branch where the alternative is a gate that can
# never report at all. Each of the three emits a warning annotation saying
# so, so a green tick is never the only thing a reader sees.
#
# REMEDIATION: the child branch above carries the real versions of the three.
# Review any promotion into this branch against that branch's CI for those,
# and against this file for `shell-tests`.
on: [pull_request]
# Deny by default, then grant the single read scope the one real job needs.
# The three placeholder jobs run `echo` and get nothing, matching the pattern
# ai-review.yml uses: an empty top-level block is not cosmetic, because a job
# that forgets its own permissions block would otherwise inherit the
# repository's default token scopes, which can include write.
permissions: {}
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report a placeholder result
        env:
          MSG: >-
            'pre-commit' verified NOTHING on this branch: the trust anchor carries no
            hook config. The real check lives on the child branch above.
        run: echo "::warning title=Placeholder check::$MSG"
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report a placeholder result
        env:
          MSG: >-
            'actionlint' verified NOTHING on this branch. The real check lives on the
            child branch above.
        run: echo "::warning title=Placeholder check::$MSG"
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report a placeholder result
        env:
          MSG: >-
            'gitleaks' verified NOTHING on this branch. The real check lives on the
            child branch above.
        run: echo "::warning title=Placeholder check::$MSG"
  # The one job on this branch that verifies something. `mise run test` runs
  # scripts/mise/test.sh, which globs scripts/tests/*.bash and fails the job
  # if any of them fails, so a repair to a trunk script is proven here rather
  # than one rung up on a branch that cannot execute it.
  shell-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # jq only. The tests parse JSON and YAML fixtures; none of them runs the
      # review engine, so the claude CLI has no business on this job's PATH.
      # Same per-job scoping argument as ai-review-trunk.yml's jobs.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          version: "2025.10.10"
          install_args: jq
          cache: false
      - run: mise run test
