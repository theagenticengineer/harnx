name: ci
# PLACEHOLDER. THIS WORKFLOW VERIFIES NOTHING. Read this before trusting a
# green check from it.
#
# This branch is the epic's TRUST ANCHOR: it is the repository's default
# branch, and it deliberately carries only the ai-review security core, not
# the hygiene floor. The real `ci.yml`, the one that actually runs
# pre-commit, gitleaks, actionlint and the shell tests, lives on the CHILD
# BRANCH IMMEDIATELY ABOVE this one, together with the config files and
# scripts those checks read (.pre-commit-config.yaml, .yamllint.yaml,
# .vale.ini, styles/, scripts/tests/, scripts/mise/). None of that is here,
# so none of those checks could run here even if this file tried.
#
# Why this file exists at all: branch protection requires the four contexts
# below. For a `pull_request` event GitHub reads workflow files from the pull
# request's HEAD branch, so a pull request whose head is THIS branch would
# never report them and would sit permanently blocked on four checks that can
# never arrive. This file makes them report.
#
# WHAT THAT COSTS, stated plainly: for a pull request cut directly from this
# branch, these four checks are green and mean NOTHING. That is the same
# shape as the tamper this repo's CODEOWNERS exists to catch ("redefining
# mise.toml's test task to a no-op"), shipped deliberately, with its eyes
# open, scoped to the one branch where the alternative is a gate that can
# never report at all. Every job below emits a warning annotation saying so,
# so a green tick is never the only thing a reader sees.
#
# In practice nothing else rides on this. Every working branch in this epic
# stacks on the child branch above, whose real `ci.yml` replaces this file
# wholesale at the same path, so this version only ever runs for a pull
# request whose head is the trust anchor itself: a rare, human-gated
# promotion.
#
# REMEDIATION: the child branch above carries the real checks. Review any
# promotion into this branch against that branch's CI, never against this
# file's output.
on: [pull_request]
permissions: {}
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report a placeholder result
        env:
          MSG: >-
            'pre-commit' verified NOTHING on this branch: the trust anchor carries no
            hook config. The real check lives on the child branch above.
        run: echo "::warning title=Placeholder check::$MSG"
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report a placeholder result
        env:
          MSG: >-
            'actionlint' verified NOTHING on this branch. The real check lives on the
            child branch above.
        run: echo "::warning title=Placeholder check::$MSG"
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report a placeholder result
        env:
          MSG: >-
            'gitleaks' verified NOTHING on this branch. The real check lives on the
            child branch above.
        run: echo "::warning title=Placeholder check::$MSG"
  shell-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report a placeholder result
        env:
          MSG: >-
            'shell-tests' verified NOTHING on this branch: the trust anchor carries no
            test suite. The real check lives on the child branch above.
        run: echo "::warning title=Placeholder check::$MSG"
