name: secret-probe
# TEMPORARY RED-TEAM PROBE. Delete with its branch; never merge.
#
# Simulates Pattern 1 from issue #37: a pull request adding a brand-new
# pull_request-triggered job that names the pipeline's secrets directly. It
# prints only LENGTHS, never a value, so the probe itself cannot leak anything
# even in a public log.
on: [pull_request]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No `environment:` declared, which is the whole point: a REPOSITORY
      # secret is available to any job that names it, so this is what the
      # environment scoping has to make impossible.
      - name: Try to read the secrets with no environment declared
        env:
          ENGINE: ${{ secrets.AI_REVIEW_ENGINE_TOKEN_CLAUDE }}
          APP_ID: ${{ secrets.AI_REVIEW_APP_ID }}
          APP_KEY: ${{ secrets.AI_REVIEW_APP_KEY }}
        run: |
          echo "AI_REVIEW_ENGINE_TOKEN_CLAUDE length: ${#ENGINE}"
          echo "AI_REVIEW_APP_ID length: ${#APP_ID}"
          echo "AI_REVIEW_APP_KEY length: ${#APP_KEY}"
          if [ "${#ENGINE}" -gt 0 ] || [ "${#APP_KEY}" -gt 0 ]; then
            echo "RESULT: SECRETS OBTAINED (exposure is real)"
          else
            echo "RESULT: NO SECRETS (exposure closed)"
          fi
